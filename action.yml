name: Check flake.lock
description: >-
  Checks a flake.lock: flakeyard inputs are released, no source is locked
  twice, the inputs of the root are pinned in the form of flakeyard, and their
  nixpkgs branches have not reached their end of life.
inputs:
  path:
    description: The lock file, relative to the workspace.
    default: flake.lock
  allow-duplicates:
    description: >-
      Normalized sources that may be locked more than once, one per line, such
      as github.com/nixos/nixpkgs or github.com/<owner>/<repo>?dir=<dir>.
    default: ""
  pin-form:
    description: >-
      Check that every input of the root is pinned as
      git+https://github.com/<owner>/<repo>?ref=<ref>&rev=<commit>&shallow=1.
      false switches the check off.
    default: "true"
  nixpkgs-eol:
    description: >-
      Check the end of life of the nixpkgs branch of every input of the root:
      a warning from 30 days before it, a failure after it in scheduled runs.
      false switches the check off.
    default: "true"
  github-token:
    description: >-
      Token for reading the releases of flakeyard repositories; it needs no
      permissions.
    default: ${{ github.token }}
# The first step gives the directory of the shell library, and rejects every
# runner that the library does not support (ADR-0001). The other steps use the
# runner's bash in privileged mode (-p), which reads no BASH_ENV and imports no
# functions or shell options, and run-step.sh of the library gives each script
# only the variables named on its run line, so that earlier steps of the job
# cannot inject code through them. Variables of the dynamic loader, such as
# LD_PRELOAD, still reach the first bash of every step: GitHub does not block
# them. Only the step that looks up releases gets the token.
runs:
  using: composite
  steps:
    - id: lib
      uses: flakeyard/action-shell-lib@f49e13a81812082d44a37a1b585f8a69edb76d83 # v0.1.3

    - name: Check the server and inputs
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        LOCK_PATH: ${{ inputs.path }}
        ALLOW_DUPLICATES: ${{ inputs.allow-duplicates }}
        PIN_FORM: ${{ inputs.pin-form }}
        NIXPKGS_EOL: ${{ inputs.nixpkgs-eol }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" check
        LOCK_PATH ALLOW_DUPLICATES PIN_FORM NIXPKGS_EOL
        GITHUB_SERVER_URL GITHUB_WORKSPACE RUNNER_TEMP

    # PATH is the job's, where nix is; HOME and XDG_* are where nix keeps its
    # cache and configuration.
    - name: Build the tools
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" tools
        PATH HOME XDG_CONFIG_HOME XDG_CACHE_HOME RUNNER_TEMP

    # GITHUB_EVENT_NAME decides whether a branch past its end of life fails
    # the run (ADR-0002).
    - name: Parse the lock file
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        LOCK_PATH: ${{ inputs.path }}
        ALLOW_DUPLICATES: ${{ inputs.allow-duplicates }}
        PIN_FORM: ${{ inputs.pin-form }}
        NIXPKGS_EOL: ${{ inputs.nixpkgs-eol }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" parse
        LOCK_PATH ALLOW_DUPLICATES PIN_FORM NIXPKGS_EOL GITHUB_EVENT_NAME
        GITHUB_WORKSPACE RUNNER_TEMP

    - name: Look up the releases
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        TOKEN: ${{ inputs.github-token }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" releases
        TOKEN HOME XDG_CONFIG_HOME XDG_CACHE_HOME RUNNER_TEMP

    - name: Report
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        LOCK_PATH: ${{ inputs.path }}
        PIN_FORM: ${{ inputs.pin-form }}
        NIXPKGS_EOL: ${{ inputs.nixpkgs-eol }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" report
        LOCK_PATH PIN_FORM NIXPKGS_EOL GITHUB_STEP_SUMMARY RUNNER_TEMP
