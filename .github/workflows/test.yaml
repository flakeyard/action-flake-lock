# CI of this repository: the tools of the root flake and the action itself on
# every supported runner, then workflow-check, which builds the checks of
# dev/flake.nix.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  tools:
    name: Tools on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@a221f6da7d616d4d548659d91f24f5e8f8f77fda # v0.1.6
      # The lock that consumers get, by the rules of the action itself:
      # workflow-check checks only dev/flake.lock.
      - name: The root flake.lock
        uses: $/
      - run: tests/ci/tools.sh

  action:
    name: Action on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@a221f6da7d616d4d548659d91f24f5e8f8f77fda # v0.1.6
      - name: A lock that passes
        uses: $/
        with:
          path: tests/fixtures/locks/ci-pass/flake.lock
          # The fixture keeps its nixpkgs branch, which reaches its end of life
          # and would then fail every scheduled run; the unit tests cover the
          # dates.
          nixpkgs-eol: false
      - id: failing
        name: A lock that breaks every rule
        continue-on-error: true
        uses: $/
        with:
          path: tests/fixtures/locks/ci-fail/flake.lock
      - name: Check that it failed
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: tests/ci/failed.sh
      # The shell library at the commit of action.yml, for the steps that
      # tests/ci/failing.sh runs as action.yml does.
      - id: lib
        uses: flakeyard/action-shell-lib@5c59164109499a225af9b75488caf142802add84 # v0.3.1
      - name: Check the annotations of every rule
        env:
          SHELL_LIB: ${{ steps.lib.outputs.path }}
          TOKEN: ${{ github.token }}
        run: tests/ci/failing.sh

  check:
    needs: [tools, action]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@b9c9cf9eee29687de53f70cc8f3da4e1de6b2b30 # v0.3.4
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: ./dev
      expect-checks: '["formatting","shell","tools","unit"]'
      renovate-presets: '["flakeyard/renovate-config"]'
